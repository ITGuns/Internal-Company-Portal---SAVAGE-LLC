services:
  - type: keyvalue
    name: mydeskii-redis
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: mydeskii-backend
    runtime: docker
    plan: starter
    region: singapore
    repo: https://github.com/ITGuns/Internal-Company-Portal---SAVAGE-LLC
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /ready
    preDeployCommand: npm run prisma:deploy:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_RATE_LIMIT_STORE
        value: redis
      - key: AUTH_RATE_LIMIT_REDIS_PREFIX
        value: portal:auth-rate-limit
      - key: ENABLE_SOCKET_REDIS_ADAPTER
        value: "true"
      - key: COMMERCIAL_READINESS_MODE
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mydeskii-redis
          property: connectionString
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: FRONTEND_URL
        sync: false
      # Base URL used to build deep links in ticket receipt emails.
      - key: APP_PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # Shared secret for POST /api/gemfield/progress (HMAC-SHA256). The Gemfield
      # progress sender must use the SAME value, so this is sync:false (operator sets
      # it) rather than generateValue. Unset => the route returns 503 and the staff
      # editor carries progress. See docs/gemfield-bridge/BLOCKERS.md (B3).
      - key: GEMFIELD_WEBHOOK_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      - key: OPS_MANAGER_EMAIL
        value: admin@savage.com
      - key: ADMIN_EMAILS
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: sendgrid
      - key: EMAIL_FROM_ADDRESS
        value: noreply@savage-llc.com
      # Sender display name on all outbound mail. Kept in sync with the
      # EMAIL_FROM_NAME fallback in backend/src/email/email.config.ts.
      # NOTE: EMAIL_FROM_ADDRESS above still uses the savage-llc.com domain
      # because that is what is authenticated in SendGrid. Do not change it
      # until a mydeskii.com sender domain is verified there, or mail will
      # start failing to send.
      - key: EMAIL_FROM_NAME
        value: Deskii
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: UPLOAD_STORAGE_DRIVER
        value: s3
      - key: UPLOAD_S3_BUCKET
        sync: false
      - key: UPLOAD_S3_REGION
        value: auto
      - key: UPLOAD_S3_ENDPOINT
        sync: false
      - key: UPLOAD_S3_FORCE_PATH_STYLE
        value: "false"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
